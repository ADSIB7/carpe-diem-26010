<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse Login | AgriShield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>

  <main class="role-layout container">
    <section class="role-card">
      <p class="kicker">WAREHOUSE ACCESS</p>
      <h1>Control storage, quality, and dispatch from one dashboard.</h1>
      <p>Track occupancy, run automated routing rules, and keep cold chain metrics in range.</p>
      <div class="auth-switch" role="tablist" aria-label="Warehouse access mode">
        <button class="auth-tab active" id="showRegister" type="button" role="tab" aria-selected="true">Register</button>
        <button class="auth-tab" id="showLogin" type="button" role="tab" aria-selected="false">Login</button>
      </div>

      <div class="auth-msg" id="authMsg" aria-live="polite"></div>

      <div class="auth-forms">
        <form class="login-form auth-panel active" id="registerForm" novalidate>
          <label for="reg-name">Full Name</label>
          <input id="reg-name" type="text" placeholder="Ravi Sharma" required />

        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="ravi.sharma@agrishield.com" required />

        <label for="reg-phone">Phone</label>
        <input id="reg-phone" type="text" placeholder="+1 (555) 230-9876" required />

        <label for="reg-warehouse">Warehouse Name</label>
        <input id="reg-warehouse" type="text" placeholder="Green Valley Warehouse" required />

        <label for="reg-location">Location</label>
        <input id="reg-location" type="text" placeholder="Fresno, CA" required />

        <label for="reg-address">Address</label>
        <input id="reg-address" type="text" placeholder="1450 Sunrise Blvd, Fresno, CA" required />

        <label for="reg-company">Company Name</label>
        <input id="reg-company" type="text" placeholder="AgriShield Logistics" required />

        <label for="reg-id">Operator ID</label>
        <input id="reg-id" type="text" placeholder="WH-CTRL-07" required />

        <label for="reg-pass">Password</label>
        <input id="reg-pass" type="password" placeholder="Create password" required />

        <label for="reg-confirm">Confirm Password</label>
        <input id="reg-confirm" type="password" placeholder="Repeat password" required />

          <button type="submit" class="btn btn-primary">Register Warehouse Owner</button>
        </form>

        <form class="login-form auth-panel" id="loginForm" novalidate>
          <label for="warehouse-id">Email</label>
          <input id="warehouse-id" type="email" placeholder="ravi.sharma@agrishield.com" required />

        <label for="warehouse-pass">Password</label>
        <input id="warehouse-pass" type="password" placeholder="Enter password" required />

          <button type="submit" class="btn btn-primary">Login as Warehouse</button>
        </form>
      </div>
      <a class="back-link" href="index.html">Back to Home</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="runtime-config.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (function () {
      const showRegister = document.getElementById("showRegister");
      const showLogin = document.getElementById("showLogin");
      const registerForm = document.getElementById("registerForm");
      const loginForm = document.getElementById("loginForm");
      const authMsg = document.getElementById("authMsg");

      const storageKey = "warehouseAuthUser";
      const pendingProfileKey = "warehousePendingProfile";
      let supabase;

      try {
        supabase = window.AgriSupabase.getClient();
      } catch (error) {
        showMessage(error.message, true);
      }

      function showMessage(message, isError) {
        authMsg.textContent = message;
        authMsg.classList.toggle("error", Boolean(isError));
      }

      function setPanel(mode, keepMessage) {
        const isRegister = mode === "register";
        registerForm.classList.toggle("active", isRegister);
        loginForm.classList.toggle("active", !isRegister);
        showRegister.classList.toggle("active", isRegister);
        showLogin.classList.toggle("active", !isRegister);
        showRegister.setAttribute("aria-selected", String(isRegister));
        showLogin.setAttribute("aria-selected", String(!isRegister));
        if (!keepMessage) {
          showMessage("");
        }
      }

      function makeMemberSince() {
        return "Member since " + new Date().getFullYear();
      }

      function saveProfileData(user) {
        localStorage.setItem("profileName", user.name);
        localStorage.setItem("profileEmail", user.email);
        localStorage.setItem("profilePhone", user.phone);
        localStorage.setItem("profileAddress", user.address);
        localStorage.setItem("profileRole", "Warehouse Owner");
        localStorage.setItem("profileCompany", user.company);
        localStorage.setItem("profileWarehouse", user.warehouse);
        localStorage.setItem("profileLocation", user.location);
        localStorage.setItem("profileMember", user.memberSince);
        if (!localStorage.getItem("profileImage")) {
          localStorage.setItem("profileImage", "warehouse-owner-profile.png");
        }
      }

      function saveWarehouseSession(user) {
        localStorage.setItem(storageKey, JSON.stringify(user));
        localStorage.setItem("warehouseLoggedIn", "true");
        localStorage.setItem("warehouseSessionOperatorId", user.operatorId || user.userId);
      }

      async function loadProfileForSignedInUser(authUser) {
        const profileRes = await window.AgriSupabase.getWarehouseProfileByUserId(supabase, authUser.id);
        if (profileRes.error) {
          throw profileRes.error;
        }

        const p = profileRes.data || {};
        return {
          userId: authUser.id,
          name: p.name || authUser.user_metadata?.full_name || "Warehouse Owner",
          email: authUser.email || "",
          phone: p.phone || "",
          warehouse: p.warehouse || "",
          location: p.location || "Warehouse",
          address: p.address || "",
          company: p.company || "",
          operatorId: p.operator_id || authUser.id,
          memberSince: p.member_since || makeMemberSince()
        };
      }

      async function ensureProfileForSignedInUser(authUser) {
        const profileRes = await window.AgriSupabase.getWarehouseProfileByUserId(supabase, authUser.id);
        if (profileRes.error) {
          throw profileRes.error;
        }
        if (profileRes.data) {
          return;
        }

        let pending = null;
        try {
          const rawPending = localStorage.getItem(pendingProfileKey);
          pending = rawPending ? JSON.parse(rawPending) : null;
        } catch (error) {
          pending = null;
        }

        if (!pending) {
          const fallbackProfile = {
            user_id: authUser.id,
            name: authUser.user_metadata?.full_name || "Warehouse Owner",
            phone: "",
            warehouse: "",
            location: "Warehouse",
            address: "",
            company: "",
            operator_id: authUser.id,
            member_since: makeMemberSince()
          };
          const fallbackUpsert = await window.AgriSupabase.upsertWarehouseProfile(supabase, fallbackProfile);
          if (fallbackUpsert.error) {
            throw fallbackUpsert.error;
          }
          return;
        }

        const pendingProfile = {
          user_id: authUser.id,
          name: pending.name || authUser.user_metadata?.full_name || "Warehouse Owner",
          phone: pending.phone || "",
          warehouse: pending.warehouse || "",
          location: pending.location || "Warehouse",
          address: pending.address || "",
          company: pending.company || "",
          operator_id: pending.operator_id || authUser.id,
          member_since: pending.member_since || makeMemberSince()
        };
        const upsertRes = await window.AgriSupabase.upsertWarehouseProfile(supabase, pendingProfile);
        if (upsertRes.error) {
          throw upsertRes.error;
        }
        localStorage.removeItem(pendingProfileKey);
      }

      showRegister.addEventListener("click", function () {
        setPanel("register");
      });

      showLogin.addEventListener("click", function () {
        setPanel("login");
      });

      registerForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!supabase) {
          showMessage("Supabase is not configured.", true);
          return;
        }

        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const phone = document.getElementById("reg-phone").value.trim();
        const warehouse = document.getElementById("reg-warehouse").value.trim();
        const location = document.getElementById("reg-location").value.trim();
        const address = document.getElementById("reg-address").value.trim();
        const company = document.getElementById("reg-company").value.trim();
        const operatorId = document.getElementById("reg-id").value.trim();
        const password = document.getElementById("reg-pass").value;
        const confirm = document.getElementById("reg-confirm").value;

        if (!name || !email || !phone || !warehouse || !location || !address || !company || !operatorId || !password) {
          showMessage("Please fill in all registration fields.", true);
          return;
        }

        if (password !== confirm) {
          showMessage("Password and confirm password do not match.", true);
          return;
        }

        const memberSince = makeMemberSince();

        const profilePayload = {
          name: name,
          phone: phone,
          warehouse: warehouse,
          location: location,
          address: address,
          company: company,
          operator_id: operatorId,
          member_since: memberSince
        };

        const signUpRes = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: name,
              role: "Warehouse Owner"
            }
          }
        });

        if (signUpRes.error) {
          showMessage(signUpRes.error.message, true);
          return;
        }

        const authUser = signUpRes.data.user;
        if (!authUser) {
          showMessage("Sign up succeeded but no user was returned. Try logging in.", false);
          setPanel("login", true);
          document.getElementById("warehouse-id").value = email;
          return;
        }

        localStorage.setItem(pendingProfileKey, JSON.stringify(profilePayload));
        if (signUpRes.data.session) {
          const upsertRes = await window.AgriSupabase.upsertWarehouseProfile(
            supabase,
            Object.assign({ user_id: authUser.id }, profilePayload)
          );
          if (upsertRes.error) {
            showMessage(upsertRes.error.message, true);
            return;
          }
          localStorage.removeItem(pendingProfileKey);
        }

        document.getElementById("warehouse-id").value = email;
        showMessage("Registration successful. Check your email if confirmation is enabled, then login.", false);
        setPanel("login", true);
      });

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!supabase) {
          showMessage("Supabase is not configured.", true);
          return;
        }

        const email = document.getElementById("warehouse-id").value.trim();
        const password = document.getElementById("warehouse-pass").value;

        const loginRes = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });
        if (loginRes.error) {
          showMessage(loginRes.error.message || "Invalid email or password.", true);
          return;
        }

        try {
          const authUser = loginRes.data.user;
          await ensureProfileForSignedInUser(authUser);
          const warehouseUser = await loadProfileForSignedInUser(authUser);
          saveProfileData(warehouseUser);
          saveWarehouseSession(warehouseUser);
          window.location.href = "warehouse-dashboard.html";
        } catch (error) {
          showMessage(error.message || "Unable to load profile after login.", true);
        }
      });

      async function hydrateFromActiveSession() {
        if (!supabase) {
          setPanel("register");
          return;
        }
        const sessionRes = await supabase.auth.getSession();
        if (sessionRes.error || !sessionRes.data.session) {
          const existingUserRaw = localStorage.getItem(storageKey);
          if (existingUserRaw) {
            try {
              const existingUser = JSON.parse(existingUserRaw);
              if (existingUser.email) {
                document.getElementById("warehouse-id").value = existingUser.email;
              }
            } catch (error) {
              // no-op
            }
            setPanel("login");
            return;
          }
          setPanel("register");
          return;
        }

        try {
          await ensureProfileForSignedInUser(sessionRes.data.session.user);
          const warehouseUser = await loadProfileForSignedInUser(sessionRes.data.session.user);
          saveProfileData(warehouseUser);
          saveWarehouseSession(warehouseUser);
          window.location.href = "warehouse-dashboard.html";
        } catch (error) {
          showMessage(error.message || "Unable to load profile for active session.", true);
          setPanel("login");
        }
      }

      hydrateFromActiveSession();
    })();
  </script>
</body>
</html>
