<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merchant Login | AgriShield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>

  <main class="role-layout container">
    <section class="role-card">
      <p class="kicker">MERCHANT ACCESS</p>
      <h1>Order inventory with live freshness and stock data.</h1>
      <p>Place orders with clear quality status and ready dispatch times.</p>
      <form class="login-form" action="#" method="post">
        <label for="merchant-id">Merchant ID</label>
        <input id="merchant-id" name="merchant-id" type="text" placeholder="MRC-6201" required />

        <label for="merchant-pass">Password</label>
        <input id="merchant-pass" name="merchant-pass" type="password" placeholder="Enter password" required />

        <button type="submit" class="btn btn-primary">Login as Merchant</button>
      </form>
      <a class="back-link" href="index.html">Back to Home</a>
    </section>
  </main>
</body>
</html>
