<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merchant Login | AgriShield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="farmer-auth.css" />
</head>

<body>
  <div class="site-bg" aria-hidden="true"></div>

  <main class="role-layout container">
    <section class="role-card">
      <p class="kicker">MERCHANT ACCESS</p>
      <h1>Track and order produce with trusted warehouse visibility.</h1>
      <p>Use your merchant account to monitor stock and place orders quickly.</p>

      <div class="auth-switch" role="tablist" aria-label="Merchant access mode">
        <button class="auth-tab active" id="showRegister" type="button" role="tab"
          aria-selected="true">Register</button>
        <button class="auth-tab" id="showLogin" type="button" role="tab" aria-selected="false">Login</button>
      </div>

      <div class="auth-msg" id="authMsg" aria-live="polite"></div>

      <div class="auth-forms">
        <form class="login-form auth-panel active" id="registerForm" novalidate>
          <label for="reg-name">Full Name</label>
          <input id="reg-name" type="text" placeholder="Aryan Deepak" required />

          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="aryan@merchant.com" required />

          <label for="reg-phone">Phone Number</label>
          <input id="reg-phone" type="text" placeholder="+1 (555) 210-1040" required />

          <label for="reg-business">Business Name</label>
          <input id="reg-business" type="text" placeholder="FreshRoute Traders" required />

          <label for="reg-location">Business Location</label>
          <input id="reg-location" type="text" placeholder="San Jose, CA" required />

          <label for="reg-pass">Password</label>
          <input id="reg-pass" type="password" placeholder="Create password" required />

          <label for="reg-confirm">Confirm Password</label>
          <input id="reg-confirm" type="password" placeholder="Repeat password" required />

          <button type="submit" class="btn btn-primary">Register Merchant</button>
        </form>

        <form class="login-form auth-panel" id="loginForm" novalidate>
          <label for="merchant-email">Email</label>
          <input id="merchant-email" type="email" placeholder="aryan@merchant.com" required />

          <label for="merchant-pass">Password</label>
          <input id="merchant-pass" type="password" placeholder="Enter password" required />

          <button type="submit" class="btn btn-primary">Login as Merchant</button>
        </form>
      </div>

      <a class="back-link" href="index.html">Back to Home</a>
    </section>
  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="runtime-config.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function () {
      const showRegister = document.getElementById("showRegister");
      const showLogin = document.getElementById("showLogin");
      const registerForm = document.getElementById("registerForm");
      const loginForm = document.getElementById("loginForm");
      const authMsg = document.getElementById("authMsg");
      const storageKey = "merchantAuthUser";

      function showMessage(message, isError) {
        authMsg.textContent = message;
        authMsg.classList.toggle("error", Boolean(isError));
      }

      function setPanel(mode) {
        const isRegister = mode === "register";
        registerForm.classList.toggle("active", isRegister);
        loginForm.classList.toggle("active", !isRegister);
        showRegister.classList.toggle("active", isRegister);
        showLogin.classList.toggle("active", !isRegister);
        showRegister.setAttribute("aria-selected", String(isRegister));
        showLogin.setAttribute("aria-selected", String(!isRegister));
        showMessage("");
      }

      showRegister.addEventListener("click", function () {
        setPanel("register");
      });

      showLogin.addEventListener("click", function () {
        setPanel("login");
      });

      registerForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim().toLowerCase();
        const phone = document.getElementById("reg-phone").value.trim();
        const businessName = document.getElementById("reg-business").value.trim();
        const businessLocation = document.getElementById("reg-location").value.trim();
        const password = document.getElementById("reg-pass").value;
        const confirm = document.getElementById("reg-confirm").value;

        if (!name || !email || !phone || !businessName || !businessLocation || !password) {
          showMessage("Please fill in all registration fields.", true);
          return;
        }

        if (password !== confirm) {
          showMessage("Password and confirm password do not match.", true);
          return;
        }

        try {
          const res = await window.AgriApi.registerMerchant({
            name,
            email,
            phone,
            businessName,
            businessLocation,
            password
          });

          const user = {
            name,
            email,
            phone,
            businessName,
            businessLocation,
            password,
            userId: res.data.userId
          };

          localStorage.setItem(storageKey, JSON.stringify(user));
          localStorage.setItem("merchantName", user.name);
          localStorage.setItem("merchantCompany", user.businessName);
          localStorage.setItem("merchantLocation", user.businessLocation);
          document.getElementById("merchant-email").value = user.email;
          showMessage("Registration successful. Please login with your email and password.", false);
          setPanel("login");
        } catch (error) {
          showMessage(error.error || "Registration failed", true);
        }
      });

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("merchant-email").value.trim().toLowerCase();
        const password = document.getElementById("merchant-pass").value;

        if (!email || !password) {
          showMessage("Please enter both email and password.", true);
          return;
        }

        try {
          const res = await window.AgriApi.loginMerchant({ email, password });
          const savedUser = res.data;

          localStorage.setItem("merchantName", savedUser.name);
          localStorage.setItem("merchantCompany", savedUser.business_name || savedUser.businessName);
          localStorage.setItem("merchantLocation", savedUser.business_location || savedUser.businessLocation);
          localStorage.setItem("merchantLoggedIn", "true");
          window.location.href = "merchant-dashboard.html";
        } catch (error) {
          showMessage(error.error || "Login failed. Check your credentials.", true);
        }
      });

      const existingUserRaw = localStorage.getItem(storageKey);
      if (existingUserRaw) {
        const existingUser = JSON.parse(existingUserRaw);
        if (existingUser.email) {
          document.getElementById("merchant-email").value = existingUser.email;
        }
        setPanel("login");
      } else {
        setPanel("register");
      }
    })();
  </script>
</body>

</html>
